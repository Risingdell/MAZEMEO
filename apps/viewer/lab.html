<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Lab — Forest Escape</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d1b; font-family: system-ui, sans-serif; }
      canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #swatches { position: fixed; top: 12px; right: 12px; display: grid; gap: 8px; }
      #swatches figure { margin: 0; background: #3a4a3a; padding: 6px; border-radius: 8px; color: #ddd; font-size: 11px; text-align: center; }
      #swatches canvas { width: 200px; height: 200px; display: block; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="swatches"></div>
    <script type="module" src="./src/lab.ts"></script>
  </body>
</html>
